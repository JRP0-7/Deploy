<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Conductor — CleanCity SPS</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/Style.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857' },
            gov: { 900: '#090d16' }
          }
        }
      }
    }
  </script>

  <script src="../../js/api.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased overflow-x-hidden">

  <div class="fixed inset-0 pointer-events-none">
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[500px] bg-gradient-to-tr from-cyan-500/15 to-brand-500/10 rounded-full blur-[140px]"></div>
  </div>

  <div class="relative min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <a href="../../index.html" class="flex items-center gap-2 text-slate-400 hover:text-brand-400 text-xs font-semibold mb-6 transition">
        <i class="fa-solid fa-arrow-left"></i> Volver al portal ciudadano
      </a>

      <div class="glass-card rounded-3xl p-6 sm:p-8 border border-slate-700 shadow-2xl">
        <div class="text-center mb-6">
          <div class="w-14 h-14 rounded-2xl bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 flex items-center justify-center text-2xl mx-auto mb-3">
            <i class="fa-solid fa-truck-fast"></i>
          </div>
          <h1 class="text-xl font-black text-white">Acceso Conductor</h1>
          <p class="text-xs text-slate-400 mt-1">Solo personal de recolección autorizado</p>
        </div>

        <form id="loginForm" class="space-y-4 text-sm">
          <div>
            <label class="block text-slate-300 font-semibold mb-1.5 text-xs" for="inputId">ID de empleado</label>
            <div class="relative">
              <i class="fa-solid fa-id-badge absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
              <input type="text" id="inputId" placeholder="EMP-00001" required
                class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl pl-10 pr-4 py-3 text-sm outline-none focus:border-brand-500 transition font-mono uppercase placeholder:font-sans placeholder:normal-case" />
            </div>
          </div>

          <div>
            <label class="block text-slate-300 font-semibold mb-1.5 text-xs" for="inputPass">Contraseña</label>
            <div class="relative">
              <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
              <input type="password" id="inputPass" placeholder="••••••••" required
                class="w-full bg-slate-950 border border-slate-800 text-slate-100 rounded-xl pl-10 pr-4 py-3 text-sm outline-none focus:border-brand-500 transition" />
            </div>
          </div>

          <button type="submit" id="btnSubmit"
            class="w-full bg-gradient-to-r from-cyan-500 to-brand-600 hover:from-cyan-400 hover:to-brand-500 text-slate-950 font-extrabold py-3.5 rounded-xl text-sm transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2 active:scale-95 disabled:opacity-60 disabled:cursor-not-allowed">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>Ingresar</span>
          </button>
        </form>

        <div id="errorBox" class="hidden mt-4 bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs rounded-xl px-3 py-2.5 flex items-center gap-2">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="errorMsg"></span>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-800 text-[11px] text-slate-500 flex items-center gap-2 justify-center">
          <i class="fa-solid fa-shield-halved text-brand-500"></i>
          Conexión cifrada · Token JWT de sesión
        </div>
      </div>
    </div>
  </div>

  <script>
    function showError(msg) {
      document.getElementById('errorMsg').textContent = msg;
      document.getElementById('errorBox').classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('errorBox').classList.add('hidden');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const id = document.getElementById('inputId').value.trim().toUpperCase();
      const password = document.getElementById('inputPass').value;
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;

      try {
        const resultado = await iniciarSesion({ id, password });
        if (!resultado.usuario || resultado.usuario.rol !== 'empleado') {
          showError('Esta cuenta no es de conductor/empleado.');
          return;
        }
        guardarSesion(resultado);
        location.href = 'panel.html';
      } catch (err) {
        showError(err.message || 'Credenciales inválidas.');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
