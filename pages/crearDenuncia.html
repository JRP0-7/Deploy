<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Denuncia — CleanCity SPS</title>
  <script src="../js/authGuard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" type="text/css" href="../css/style.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] },
      colors: { brand: { 400: '#34d399', 500: '#10b981', 600: '#059669' }, gov: { 900: '#090d16', gold: '#fbbf24' } } } } }
  </script>
  <script src="../js/api.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">
  <header class="glass-nav sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../index.html" class="font-black text-white">CleanCity <span class="text-brand-400">SPS</span></a>
      <nav class="flex items-center gap-4 text-xs font-semibold uppercase text-slate-300">
        <a href="calendarioRutas.html" class="hover:text-brand-400">Calendario</a>
        <a href="verHorarios.html" class="hover:text-brand-400">Horarios</a>
        <a href="crearDenuncia.html" class="text-brand-400">Denunciar</a>
        <a href="consultarDenuncias.html" class="hover:text-brand-400">Mis denuncias</a>
        <a href="mapaRutas.html" class="hover:text-brand-400">Mapa</a>
        <button onclick="cerrarSesion(); window.location.href='../login.html';" class="text-red-300 hover:text-red-200">Salir</button>
      </nav>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-black text-white mb-1">Reportar un problema</h1>
    <p class="text-sm text-slate-400 mb-6">Basura acumulada, camión que no pasó, o punto ilegal de disposición.</p>

    <div id="mensajeError" class="hidden mb-4 text-xs text-red-300 bg-red-950/50 border border-red-800 rounded-lg px-3 py-2"></div>
    <div id="mensajeExito" class="hidden mb-4 text-xs text-brand-200 bg-brand-950/50 border border-brand-700 rounded-lg px-3 py-2"></div>

    <form id="formDenuncia" onsubmit="manejarSubmit(event)" class="space-y-4 glass-card border border-slate-800 rounded-2xl p-6">
      <div>
        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wide">Tipo de problema</label>
        <select id="tipo" required class="mt-1 w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm outline-none focus:border-brand-500">
          <option value="basura_acumulada">Basura acumulada</option>
          <option value="no_paso_camion">El camión no pasó</option>
          <option value="botadero_ilegal">Punto ilegal de disposición</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wide">Descripción</label>
        <textarea id="descripcion" rows="4" placeholder="Contanos qué está pasando..."
          class="mt-1 w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm outline-none focus:border-brand-500"></textarea>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wide">Foto (URL, opcional)</label>
        <input id="fotoUrl" type="url" placeholder="https://..."
          class="mt-1 w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm outline-none focus:border-brand-500" />
      </div>
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3 rounded-xl text-sm transition">
        <i class="fa-solid fa-bullhorn mr-2"></i>Enviar denuncia
      </button>
    </form>
  </main>

  <script>
    function ocultarMensajes() {
      document.getElementById('mensajeError').classList.add('hidden');
      document.getElementById('mensajeExito').classList.add('hidden');
    }

    async function manejarSubmit(evento) {
      evento.preventDefault();
      ocultarMensajes();
      const usuario = obtenerUsuario();
      if (!usuario || !usuario.coloniaId) {
        document.getElementById('mensajeError').textContent = 'No tenés colonia asignada en tu cuenta.';
        document.getElementById('mensajeError').classList.remove('hidden');
        return;
      }
      try {
        const tipo = document.getElementById('tipo').value;
        const descripcion = document.getElementById('descripcion').value.trim();
        const fotoUrl = document.getElementById('fotoUrl').value.trim();
        const denuncia = await crearDenuncia({
          coloniaId: usuario.coloniaId,
          tipo,
          descripcion: descripcion || undefined,
          fotoUrl: fotoUrl || undefined
        });
        document.getElementById('formDenuncia').reset();
        const exito = document.getElementById('mensajeExito');
        exito.textContent = `Denuncia registrada (código ${denuncia.id}). Podés seguirla en "Mis denuncias".`;
        exito.classList.remove('hidden');
      } catch (err) {
        const error = document.getElementById('mensajeError');
        error.textContent = err.message;
        error.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
